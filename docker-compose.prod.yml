# Production build, locally: the app image + Redis + Postgres. One command:
#   docker compose -f docker-compose.prod.yml up -d --build
# then play at http://localhost:8080 (health: http://localhost:8080/health).
# A separate project name keeps its containers and volume apart from the dev docker-compose.yml.
name: durak-prod

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: durak-online:local
    restart: unless-stopped
    ports:
      # APP_BIND=127.0.0.1 (set by `npm run tunnel`) keeps the port off the LAN, so the only way in
      # is through the tunnel and nobody can reach the app directly with a forged X-Forwarded-For.
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8080}:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      REDIS_URL: redis://redis:6379
      # Same-origin by default; list extra browser origins (comma-separated) only if needed.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Number of reverse-proxy hops in front of the app: 0 when browsers connect directly,
      # 1 behind a Cloudflare Quick Tunnel (`npm run tunnel` sets it; see DEPLOY.md).
      TRUST_PROXY: ${TRUST_PROXY:-0}
      BOT_WORKERS: ${BOT_WORKERS:-}
      # Profiles, match history and ratings (Phase 10). Migrations run at startup. If Postgres is
      # down the app still serves games (ratings off) and reconnects on its own.
      DATABASE_URL: postgresql://${POSTGRES_USER:-durak}:${POSTGRES_PASSWORD:-durak}@postgres:5432/${POSTGRES_DB:-durak}
    depends_on:
      redis:
        condition: service_healthy
      # Started, not healthy: the app never waits for (or fails on) Postgres.
      postgres:
        condition: service_started
    stop_grace_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-durak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-durak}
      POSTGRES_DB: ${POSTGRES_DB:-durak}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
  postgres-data:
