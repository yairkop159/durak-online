name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # The server's Redis tests run against this (they are skipped when no Redis is reachable).
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      # Before the tests: the bot worker threads load @durak/game-engine from its dist.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  docker:
    name: Production image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Build the image (not pushed)
        run: docker build -t durak-online:ci .

      - name: Boot it with Redis and run the end-to-end smoke test
        run: |
          docker network create durak
          docker run -d --name redis --network durak redis:7-alpine
          docker run -d --name app --network durak -p 8080:8080 -e REDIS_URL=redis://redis:6379 durak-online:ci
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:8080/health && break
            sleep 1
          done
          npm ci --no-audit --no-fund
          npm run build --workspace=packages/shared --workspace=packages/game-engine
          npm run smoke -- http://localhost:8080 8

      - name: Server logs
        if: always()
        run: docker logs app || true
